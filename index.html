<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3f7f4a">

<title>카톡 기록</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f6f5;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI","Noto Sans KR",sans-serif;
}

header{
  background:#3f7f4a;
  color:#fff;
  padding:18px 16px;
  text-align:center;
  font-size:22px;
  font-weight:700;
  position:sticky;
  top:0;
  z-index:5;
}

main{
  padding:14px 12px 92px;
  max-width:720px;
  margin:auto;
}

.status{
  text-align:center;
  color:#777;
  font-size:14px;
  padding:12px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:16px;
  margin:10px 0;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:8px;
}

.date{
  font-size:13px;
  color:#888;
  margin-bottom:10px;
}

.notes{
  font-size:16px;
  line-height:1.65;
  white-space:pre-wrap;
  word-break:break-word;
}

.media{
  margin-top:12px;
}

.media img,
.media video{
  display:block;
  width:100%;
  max-height:520px;
  object-fit:contain;
  border-radius:10px;
  background:#eee;
  margin-bottom:8px;
}

.media a{
  display:inline-block;
  margin-top:2px;
  margin-bottom:10px;
  color:#2f6f3a;
  text-decoration:none;
  font-weight:600;
}

.media-title{
  font-size:14px;
  color:#777;
  margin-bottom:8px;
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:#fff;
  border-top:1px solid #ddd;
  padding:8px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  z-index:10;
}

.bottom button{
  border:0;
  border-radius:10px;
  background:#e9eee9;
  color:#285c31;
  font-size:14px;
  font-weight:700;
  padding:13px 4px;
  min-height:48px;
}

.bottom button.active{
  background:#3f7f4a;
  color:#fff;
}

.empty{
  text-align:center;
  padding:45px 10px;
  color:#777;
}

.error{
  background:#fff0f0;
  border:1px solid #e0a0a0;
  color:#a00000;
  border-radius:12px;
  padding:15px;
  margin:12px 0;
  line-height:1.6;
}
</style>
</head>


<body>

<header>카톡 기록</header>

<main id="list">
  <div class="status">
    자료를 불러오는 중입니다...
  </div>
</main>


<nav class="bottom">

  <button data-type="일반문서">
    일반문서
  </button>

  <button data-type="중요문서">
    중요문서
  </button>

  <button data-type="이미지">
    이미지
  </button>

  <button data-type="동영상">
    동영상
  </button>

</nav>


<script>

/* =====================================================
   Cloudflare Worker
===================================================== */

const API_URL =
  "https://kakao.s01021319376.workers.dev/";


const list =
  document.getElementById("list");


let allRecords = [];


/* =====================================================
   Airtable 필드 찾기
===================================================== */

function field(fields,names){

  for(const name of names){

    if(
      fields[name] !== undefined &&
      fields[name] !== null &&
      fields[name] !== ""
    ){

      return fields[name];

    }

  }

  return "";

}


/* =====================================================
   문서 종류
===================================================== */

function getDocumentType(record){

  const f =
    record.fields || {};

  return String(
    field(
      f,
      [
        "Name",
        "문서구분",
        "DocumentType",
        "자료구분",
        "구분",
        "Type",
        "종류"
      ]
    )
  ).trim();

}


/* =====================================================
   첨부파일 가져오기
===================================================== */

function attachmentList(fields){

  const files = [];


  for(
    const [key,value]
    of Object.entries(fields || {})
  ){

    if(!Array.isArray(value)){
      continue;
    }


    for(const item of value){

      if(
        item &&
        typeof item === "object" &&
        item.url
      ){

        files.push({

          key:key,

          url:item.url,

          type:String(
            item.type || ""
          ).toLowerCase(),

          name:
            item.filename ||
            key

        });

      }

    }

  }


  return files;

}


/* =====================================================
   이미지인지 확인
===================================================== */

function isImageFile(file){

  if(
    file.type &&
    file.type.startsWith("image/")
  ){

    return true;

  }


  return /\.(jpg|jpeg|png|gif|webp|heic|heif)$/i
    .test(file.name);

}


/* =====================================================
   동영상인지 확인
===================================================== */

function isVideoFile(file){

  if(
    file.type &&
    file.type.startsWith("video/")
  ){

    return true;

  }


  return /\.(mp4|mov|m4v|webm|avi|mkv)$/i
    .test(file.name);

}


/* =====================================================
   날짜
===================================================== */

function getDate(record){

  const f =
    record.fields || {};

  return field(
    f,
    [
      "Date",
      "날짜",
      "작성일"
    ]
  );

}


/* =====================================================
   제목
===================================================== */

function getTitle(record){

  const f =
    record.fields || {};

  return field(
    f,
    [
      "Title",
      "제목",
      "Name"
    ]
  ) || "카톡 기록";

}


/* =====================================================
   내용
===================================================== */

function getNotes(record){

  const f =
    record.fields || {};

  return field(
    f,
    [
      "Notes",
      "내용",
      "Text",
      "text"
    ]
  );

}


/* =====================================================
   일반문서 / 중요문서
===================================================== */

function getDocumentRecords(type){

  return allRecords.filter(
    record => {

      return getDocumentType(record) === type;

    }
  );

}


/* =====================================================
   이미지 자료 만들기
===================================================== */

function getImageRecords(){

  const result = [];


  for(const record of allRecords){

    const fields =
      record.fields || {};

    const files =
      attachmentList(fields)
        .filter(
          file => isImageFile(file)
        );


    if(files.length){

      result.push({

        record:record,

        files:files

      });

    }

  }


  return result;

}


/* =====================================================
   동영상 자료 만들기
===================================================== */

function getVideoRecords(){

  const result = [];


  for(const record of allRecords){

    const fields =
      record.fields || {};

    const files =
      attachmentList(fields)
        .filter(
          file => isVideoFile(file)
        );


    if(files.length){

      result.push({

        record:record,

        files:files

      });

    }

  }


  return result;

}


/* =====================================================
   일반문서 / 중요문서 표시
===================================================== */

function renderDocuments(
  records,
  type
){

  list.innerHTML = "";


  if(!records.length){

    list.innerHTML =
      `<div class="empty">
        ${type} 자료가 없습니다.
      </div>`;

    return;

  }


  for(const record of records){

    const card =
      document.createElement("section");

    card.className =
      "card";


    const titleEl =
      document.createElement("div");

    titleEl.className =
      "card-title";

    titleEl.textContent =
      getTitle(record);

    card.appendChild(titleEl);


    const date =
      getDate(record);

    if(date){

      const d =
        document.createElement("div");

      d.className =
        "date";

      d.textContent =
        date;

      card.appendChild(d);

    }


    const notes =
      getNotes(record);

    if(notes){

      const n =
        document.createElement("div");

      n.className =
        "notes";

      n.textContent =
        notes;

      card.appendChild(n);

    }


    const files =
      attachmentList(
        record.fields || {}
      );


    if(files.length){

      const media =
        document.createElement("div");

      media.className =
        "media";


      for(const file of files){

        if(isVideoFile(file)){

          const v =
            document.createElement("video");

          v.src =
            file.url;

          v.controls =
            true;

          v.playsInline =
            true;

          media.appendChild(v);

        }

        else if(isImageFile(file)){

          const img =
            document.createElement("img");

          img.src =
            file.url;

          img.alt =
            file.name;

          img.loading =
            "lazy";

          media.appendChild(img);

        }


        const a =
          document.createElement("a");

        a.href =
          file.url;

        a.target =
          "_blank";

        a.rel =
          "noopener";

        a.textContent =
          "파일 보기";

        media.appendChild(a);

      }


      card.appendChild(media);

    }


    list.appendChild(card);

  }

}


/* =====================================================
   이미지 표시
   Airtable 원래 순서 유지
===================================================== */

function renderImages(){

  const imageRecords =
    getImageRecords();


  list.innerHTML = "";


  if(!imageRecords.length){

    list.innerHTML =
      `<div class="empty">
        이미지 자료가 없습니다.
      </div>`;

    return;

  }


  for(const item of imageRecords){

    const record =
      item.record;

    const files =
      item.files;


    const card =
      document.createElement("section");

    card.className =
      "card";


    /* 어느 문서의 이미지인지 */

    const title =
      document.createElement("div");

    title.className =
      "card-title";

    title.textContent =
      getTitle(record);

    card.appendChild(title);


    const documentType =
      getDocumentType(record);


    if(documentType){

      const typeEl =
        document.createElement("div");

      typeEl.className =
        "media-title";

      typeEl.textContent =
        "📁 " + documentType;

      card.appendChild(typeEl);

    }


    const date =
      getDate(record);

    if(date){

      const d =
        document.createElement("div");

      d.className =
        "date";

      d.textContent =
        date;

      card.appendChild(d);

    }


    const media =
      document.createElement("div");

    media.className =
      "media";


    for(const file of files){

      const img =
        document.createElement("img");

      img.src =
        file.url;

      img.alt =
        file.name;

      img.loading =
        "lazy";

      media.appendChild(img);


      const a =
        document.createElement("a");

      a.href =
        file.url;

      a.target =
        "_blank";

      a.rel =
        "noopener";

      a.textContent =
        "파일 보기";

      media.appendChild(a);

    }


    card.appendChild(media);

    list.appendChild(card);

  }

}


/* =====================================================
   동영상 표시
   Airtable 원래 순서 유지
===================================================== */

function renderVideos(){

  const videoRecords =
    getVideoRecords();


  list.innerHTML = "";


  if(!videoRecords.length){

    list.innerHTML =
      `<div class="empty">
        동영상 자료가 없습니다.
      </div>`;

    return;

  }


  for(const item of videoRecords){

    const record =
      item.record;

    const files =
      item.files;


    const card =
      document.createElement("section");

    card.className =
      "card";


    const title =
      document.createElement("div");

    title.className =
      "card-title";

    title.textContent =
      getTitle(record);

    card.appendChild(title);


    const documentType =
      getDocumentType(record);


    if(documentType){

      const typeEl =
        document.createElement("div");

      typeEl.className =
        "media-title";

      typeEl.textContent =
        "📁 " + documentType;

      card.appendChild(typeEl);

    }


    const date =
      getDate(record);

    if(date){

      const d =
        document.createElement("div");

      d.className =
        "date";

      d.textContent =
        date;

      card.appendChild(d);

    }


    const media =
      document.createElement("div");

    media.className =
      "media";


    for(const file of files){

      const video =
        document.createElement("video");

      video.src =
        file.url;

      video.controls =
        true;

      video.playsInline =
        true;

      media.appendChild(video);


      const a =
        document.createElement("a");

      a.href =
        file.url;

      a.target =
        "_blank";

      a.rel =
        "noopener";

      a.textContent =
        "파일 보기";

      media.appendChild(a);

    }


    card.appendChild(media);

    list.appendChild(card);

  }

}


/* =====================================================
   화면 표시
===================================================== */

function render(type){

  if(type === "이미지"){

    renderImages();

    return;

  }


  if(type === "동영상"){

    renderVideos();

    return;

  }


  renderDocuments(
    getDocumentRecords(type),
    type
  );

}


/* =====================================================
   Airtable → Worker → GitHub
===================================================== */

async function load(type){

  document
    .querySelectorAll(".bottom button")
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.type === type
        );

      }
    );


  list.innerHTML =
    `<div class="status">
      자료를 불러오는 중입니다...
    </div>`;


  try{

    /*
      매번 Worker에서 다시 가져옵니다.

      따라서 Airtable에 새로운 자료가
      들어오면 새로고침 없이도 버튼을
      누를 때 최신 데이터를 가져옵니다.
    */

    const response =
      await fetch(
        API_URL +
        "?maxRecords=100&view=" +
        encodeURIComponent(
          "viwreVjNBkgyyOG7C"
        ) +
        "&t=" +
        Date.now()
      );


    if(!response.ok){

      throw new Error(
        "Worker 응답 오류: HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if(!data.success){

      throw new Error(
        "Worker 조회 실패"
      );

    }


    /*
      Airtable에서 받은 순서를
      그대로 유지합니다.

      sort()를 사용하지 않습니다.
    */

    allRecords =
      Array.isArray(data.records)
        ? data.records
        : [];


    render(type);


  }catch(error){

    console.error(
      error
    );


    list.innerHTML =
      `<div class="error">
        <strong>
          ❌ 자료를 가져오지 못했습니다.
        </strong>
        <br><br>
        ${error.message}
      </div>`;

  }

}


/* =====================================================
   버튼
===================================================== */

document
  .querySelectorAll(".bottom button")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          load(
            button.dataset.type
          );

        }
      );

    }
  );


/* =====================================================
   처음 실행
===================================================== */

load("일반문서");

</script>

</body>
</html>
