<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>카카오톡 기록</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 26px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 250px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #777;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }

    .hint {
      margin-top: 15px;
      color: #777;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>카카오톡 기록</h1>

  <div class="card">

    <label for="content">내용</label>

    <textarea
      id="content"
      placeholder="카카오톡 내용을 붙여넣으세요."
    ></textarea>

    <button id="saveButton">
      Airtable에 저장
    </button>

    <div id="message"></div>

    <div class="hint">
      카카오톡에서 메시지를 복사한 후 이곳에 붙여넣고
      「Airtable에 저장」을 누르세요.
    </div>

  </div>

</div>

<script>

  // Cloudflare Worker 주소를 여기에 입력합니다.
  const WORKER_URL =
    "https://YOUR-WORKER.workers.dev";

  const contentInput =
    document.getElementById("content");

  const saveButton =
    document.getElementById("saveButton");

  const message =
    document.getElementById("message");


  saveButton.addEventListener("click", async () => {

    const content =
      contentInput.value.trim();

    if (!content) {
      message.textContent =
        "카카오톡 내용을 입력해주세요.";
      return;
    }

    saveButton.disabled = true;
    message.textContent = "저장 중입니다...";

    try {

      const response = await fetch(WORKER_URL, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          content: content
        })

      });

      const result =
        await response.json();

      if (!response.ok) {
        throw new Error(
          result.error || "저장에 실패했습니다."
        );
      }

      message.textContent =
        "Airtable에 저장되었습니다.";

      contentInput.value = "";

    } catch (error) {

      console.error(error);

      message.textContent =
        "저장 실패: " + error.message;

    } finally {

      saveButton.disabled = false;

    }

  });

</script>

</body>
</html>
