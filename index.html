<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>카카오톡 기록</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f6f8;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 20px 0 25px;
      font-size: 26px;
    }

    .card {
      background: #fff;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #777;
    }

    textarea {
      min-height: 250px;
      resize: vertical;
      line-height: 1.6;
    }

    .date {
      margin-top: 18px;
    }

    .content {
      margin-top: 18px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: 600;
    }

    button:disabled {
      opacity: 0.5;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      min-height: 22px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>카카오톡 기록</h1>

  <div class="card">

    <!-- 제목 -->
    <label for="name">Name</label>

    <input
      id="name"
      type="text"
      placeholder="제목을 입력하세요"
      value="카카오톡 기록"
    >


    <!-- 날짜 -->
    <div class="date">

      <label for="date">Date</label>

      <input
        id="date"
        type="datetime-local"
      >

    </div>


    <!-- 내용 -->
    <div class="content">

      <label for="notes">Notes</label>

      <textarea
        id="notes"
        placeholder="카카오톡 내용을 붙여넣으세요."
      ></textarea>

    </div>


    <!-- 저장 -->
    <button id="saveButton">
      Airtable에 저장
    </button>

    <div id="message"></div>

  </div>

</div>


<script>

  // ----------------------------------------
  // Cloudflare Worker 주소
  // ----------------------------------------

  const WORKER_URL =
    "https://kakao.s01021319376.workers.dev";


  // ----------------------------------------
  // HTML 요소
  // ----------------------------------------

  const nameInput =
    document.getElementById("name");

  const dateInput =
    document.getElementById("date");

  const notesInput =
    document.getElementById("notes");

  const saveButton =
    document.getElementById("saveButton");

  const message =
    document.getElementById("message");


  // ----------------------------------------
  // 현재 날짜/시간 자동 입력
  // ----------------------------------------

  function setCurrentDateTime() {

    const now = new Date();

    const year =
      now.getFullYear();

    const month =
      String(now.getMonth() + 1)
        .padStart(2, "0");

    const day =
      String(now.getDate())
        .padStart(2, "0");

    const hour =
      String(now.getHours())
        .padStart(2, "0");

    const minute =
      String(now.getMinutes())
        .padStart(2, "0");

    dateInput.value =
      `${year}-${month}-${day}T${hour}:${minute}`;
  }


  setCurrentDateTime();


  // ----------------------------------------
  // 저장 버튼
  // ----------------------------------------

  saveButton.addEventListener(
    "click",
    async () => {

      const name =
        nameInput.value.trim();

      const notes =
        notesInput.value.trim();

      const date =
        dateInput.value;


      // 내용 확인

      if (!notes) {

        message.textContent =
          "카카오톡 내용을 입력해주세요.";

        return;
      }


      saveButton.disabled = true;

      message.textContent =
        "Airtable에 저장하는 중입니다...";


      try {

        const response =
          await fetch(
            WORKER_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                name: name,
                notes: notes,
                date: date
              })
            }
          );


        const result =
          await response.json();


        if (!response.ok) {

          throw new Error(
            result.error ||
            "저장에 실패했습니다."
          );

        }


        // 성공

        message.textContent =
          "✓ Airtable에 저장되었습니다.";


        // 내용 비우기

        notesInput.value = "";


        // 날짜 갱신

        setCurrentDateTime();


      } catch (error) {

        console.error(error);

        message.textContent =
          "저장 실패: " +
          error.message;


      } finally {

        saveButton.disabled = false;

      }

    }
  );

</script>

</body>
</html>
