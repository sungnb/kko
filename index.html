<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3f7f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="봉사준비">
<link rel="apple-touch-icon" href="kakao-192.png">

<title>봉사준비</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f6f5;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI","Noto Sans KR",sans-serif;
}

header{
  background:#3f7f4a;
  color:#fff;
  padding:18px 16px;
  text-align:center;
  font-size:22px;
  font-weight:700;
  position:sticky;
  top:0;
  z-index:5;
}

main{
  padding:14px 12px 92px;
  max-width:720px;
  margin:auto;
}

.status{
  text-align:center;
  color:#777;
  font-size:14px;
  padding:12px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:16px;
  margin:10px 0;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:8px;
}

.date{
  font-size:13px;
  color:#888;
  margin-bottom:10px;
}

.notes{
  font-size:16px;
  line-height:1.65;
  white-space:pre-wrap;
  word-break:break-word;
}

.media{
  margin-top:12px;
}

.media img,
.media video{
  display:block;
  width:100%;
  max-height:520px;
  object-fit:contain;
  border-radius:10px;
  background:#eee;
  margin-bottom:8px;
}

.media a{
  display:inline-block;
  margin-top:2px;
  margin-bottom:10px;
  color:#2f6f3a;
  text-decoration:none;
  font-weight:600;
}

.media-title{
  font-size:14px;
  color:#777;
  margin-bottom:8px;
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:#fff;
  border-top:1px solid #ddd;
  padding:8px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  z-index:10;
}

.bottom button{
  border:0;
  border-radius:10px;
  background:#e9eee9;
  color:#285c31;
  font-size:14px;
  font-weight:700;
  padding:13px 4px;
  min-height:48px;
}

.bottom button.active{
  background:#3f7f4a;
  color:#fff;
}

.delete-button{
  display:block;
  width:100%;
  margin-top:14px;
  padding:10px 12px;
  border:1px solid #e0b0b0;
  border-radius:10px;
  background:#fff5f5;
  color:#b00000;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.delete-button:active{
  background:#ffe5e5;
}

.empty{
  text-align:center;
  padding:45px 10px;
  color:#777;
}

.error{
  background:#fff0f0;
  border:1px solid #e0a0a0;
  color:#a00000;
  border-radius:12px;
  padding:15px;
  margin:12px 0;
  line-height:1.6;
}
</style>
</head>

<body>

<header id="pageTitle">카톡 기록</header>

<main id="list">
  <div class="status">
    자료를 불러오는 중입니다...
  </div>
</main>

<nav class="bottom">
  <button data-type="일반문서">
    일반문서
  </button>

  <button data-type="중요문서">
    중요문서
  </button>

  <button data-type="이미지">
    이미지
  </button>

  <button data-type="동영상">
    동영상
  </button>
</nav>

<script>

/* =====================================================
   Cloudflare Worker
===================================================== */

const API_URL =
  "https://kakao.s01021319376.workers.dev/";


const AIRTABLE_VIEW =
  "viwreVjNBkgyyOG7C";


const list =
  document.getElementById("list");

const pageTitle =
  document.getElementById("pageTitle");


let allRecords = [];


/* =====================================================
   URL의 ?type= 값 읽기
===================================================== */

function getTypeFromURL(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const type =
    params.get("type");

  const allowedTypes = [
    "일반문서",
    "중요문서",
    "이미지",
    "동영상"
  ];

  if(
    allowedTypes.includes(type)
  ){
    return type;
  }

  return "일반문서";
}


/* =====================================================
   페이지 제목
===================================================== */

function setPageTitle(type){

  const titles = {
    "일반문서":
      "📄 일반문서",

    "중요문서":
      "⭐ 중요문서",

    "이미지":
      "🖼️ 이미지",

    "동영상":
      "🎬 동영상"
  };

  pageTitle.textContent =
    titles[type] || "카톡 기록";
}


/* =====================================================
   필드 찾기
===================================================== */

function field(fields,names){

  for(const name of names){

    if(
      fields[name] !== undefined &&
      fields[name] !== null &&
      fields[name] !== ""
    ){
      return fields[name];
    }
  }

  return "";
}


/* =====================================================
   문서 종류
===================================================== */

function getDocumentType(record){

  const f =
    record.fields || {};

  return String(
    field(
      f,
      [
        "Name",
        "문서구분",
        "DocumentType",
        "자료구분",
        "구분",
        "Type",
        "종류"
      ]
    )
  ).trim();
}


/* =====================================================
   첨부파일
===================================================== */

function attachmentList(fields){

  const files = [];

  for(
    const [key,value]
    of Object.entries(fields || {})
  ){

    if(!Array.isArray(value)){
      continue;
    }

    for(const item of value){

      if(
        item &&
        typeof item === "object" &&
        item.url
      ){
        files.push({
          key:key,
          url:item.url,
          type:String(
            item.type || ""
          ).toLowerCase(),
          name:
            item.filename ||
            key
        });
      }
    }
  }

  return files;
}


/* =====================================================
   이미지 파일
===================================================== */

function isImageFile(file){

  if(
    file.type &&
    file.type.startsWith("image/")
  ){
    return true;
  }

  return /\.(jpg|jpeg|png|gif|webp|heic|heif)$/i
    .test(file.name);
}


/* =====================================================
   동영상 파일
===================================================== */

function isVideoFile(file){

  if(
    file.type &&
    file.type.startsWith("video/")
  ){
    return true;
  }

  return /\.(mp4|mov|m4v|webm|avi|mkv)$/i
    .test(file.name);
}


/* =====================================================
   날짜
===================================================== */

function getDate(record){

  const f =
    record.fields || {};

  return field(
    f,
    [
      "Date",
      "날짜",
      "작성일"
    ]
  );
}


/* =====================================================
   제목
===================================================== */

function getTitle(record){

  const f =
    record.fields || {};

  return field(
    f,
    [
      "Title",
      "제목",
      "Name"
    ]
  ) || "카톡 기록";
}


/* =====================================================
   내용
===================================================== */

function getNotes(record){

  const f =
    record.fields || {};

  return field(
    f,
    [
      "Notes",
      "내용",
      "Text",
      "text"
    ]
  );
}


/* =====================================================
   최신순 정렬

   1순위: Airtable record.createdTime
   2순위: Date 필드

   Cloudflare Worker에서도 이미 최신순으로 보내지만,
   GitHub HTML에서도 한 번 더 정렬하여 확실하게 합니다.
===================================================== */

function getRecordSortTime(record){

  if(record && record.createdTime){

    const time =
      Date.parse(record.createdTime);

    if(!Number.isNaN(time)){
      return time;
    }
  }

  const dateValue =
    getDate(record);

  const time =
    Date.parse(String(dateValue));

  return Number.isNaN(time)
    ? 0
    : time;
}


function sortNewestFirst(records){

  return [...records].sort(
    (a,b) =>
      getRecordSortTime(b) -
      getRecordSortTime(a)
  );
}


/* =====================================================
   자료 삭제
===================================================== */

async function deleteRecord(record, card){

  const recordId =
    record && record.id;

  if(!recordId){
    alert("삭제할 자료의 ID를 찾지 못했습니다.");
    return;
  }

  const title =
    getTitle(record);

  const confirmed =
    window.confirm(
      `"${title}" 자료를 삭제하시겠습니까?\n\n삭제하면 Airtable에서도 실제로 삭제됩니다.`
    );

  if(!confirmed){
    return;
  }

  const button =
    card.querySelector(".delete-button");

  if(button){
    button.disabled = true;
    button.textContent = "삭제 중...";
  }

  try{

    const response =
      await fetch(
        API_URL,
        {
          method:"DELETE",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            recordId:recordId
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok || !data.success){
      throw new Error(
        data.error?.message ||
        data.error ||
        "자료 삭제에 실패했습니다."
      );
    }

    card.remove();

    // 현재 화면의 목록도 즉시 최신 상태로 다시 읽습니다.
    await load(
      getTypeFromURL()
    );

  }catch(error){

    console.error(error);

    alert(
      "자료를 삭제하지 못했습니다.\n\n" +
      error.message
    );

    if(button){
      button.disabled = false;
      button.textContent = "🗑️ 삭제";
    }
  }
}

function addDeleteButton(record, card){

  const button =
    document.createElement("button");

  button.type = "button";
  button.className = "delete-button";
  button.textContent = "🗑️ 삭제";

  button.addEventListener(
    "click",
    () => {
      deleteRecord(record, card);
    }
  );

  card.appendChild(button);
}


/* =====================================================
   일반문서 / 중요문서
===================================================== */


function getDocumentRecords(type){

  return sortNewestFirst(
    allRecords.filter(
      record =>
        getDocumentType(record) === type
    )
  );
}


/* =====================================================
   이미지 자료
===================================================== */

function getImageRecords(){

  const result = [];

  for(const record of allRecords){

    const files =
      attachmentList(
        record.fields || {}
      ).filter(
        file => isImageFile(file)
      );

    if(files.length){
      result.push({
        record:record,
        files:files
      });
    }
  }

  return result.sort(
    (a,b) =>
      getRecordSortTime(b.record) -
      getRecordSortTime(a.record)
  );
}


/* =====================================================
   동영상 자료
===================================================== */

function getVideoRecords(){

  const result = [];

  for(const record of allRecords){

    const files =
      attachmentList(
        record.fields || {}
      ).filter(
        file => isVideoFile(file)
      );

    if(files.length){
      result.push({
        record:record,
        files:files
      });
    }
  }

  return result.sort(
    (a,b) =>
      getRecordSortTime(b.record) -
      getRecordSortTime(a.record)
  );
}


/* =====================================================
   일반문서 / 중요문서 표시
===================================================== */

function renderDocuments(records,type){

  list.innerHTML = "";

  if(!records.length){

    list.innerHTML =
      `<div class="empty">
        ${type} 자료가 없습니다.
      </div>`;

    return;
  }

  for(const record of records){

    const card =
      document.createElement("section");

    card.className = "card";

    const titleEl =
      document.createElement("div");

    titleEl.className = "card-title";

    titleEl.textContent =
      getTitle(record);

    card.appendChild(titleEl);

    const date =
      getDate(record);

    if(date){

      const d =
        document.createElement("div");

      d.className = "date";
      d.textContent = date;

      card.appendChild(d);
    }

    const notes =
      getNotes(record);

    if(notes){

      const n =
        document.createElement("div");

      n.className = "notes";
      n.textContent = notes;

      card.appendChild(n);
    }

    const files =
      attachmentList(
        record.fields || {}
      );

    if(files.length){

      const media =
        document.createElement("div");

      media.className = "media";

      for(const file of files){

        if(isVideoFile(file)){

          const video =
            document.createElement("video");

          video.src = file.url;
          video.controls = true;
          video.playsInline = true;

          media.appendChild(video);

        } else if(isImageFile(file)){

          const img =
            document.createElement("img");

          img.src = file.url;
          img.alt = file.name;
          img.loading = "lazy";

          media.appendChild(img);
        }

        const a =
          document.createElement("a");

        a.href = file.url;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = "파일 보기";

        media.appendChild(a);
      }

      card.appendChild(media);
    }

    addDeleteButton(record, card);
    list.appendChild(card);
  }
}


/* =====================================================
   이미지 표시
===================================================== */

function renderImages(){

  const imageRecords =
    getImageRecords();

  list.innerHTML = "";

  if(!imageRecords.length){

    list.innerHTML =
      `<div class="empty">
        이미지 자료가 없습니다.
      </div>`;

    return;
  }

  for(const item of imageRecords){

    const record = item.record;
    const files = item.files;

    const card =
      document.createElement("section");

    card.className = "card";

    const title =
      document.createElement("div");

    title.className = "card-title";
    title.textContent = getTitle(record);

    card.appendChild(title);

    const documentType =
      getDocumentType(record);

    if(documentType){

      const typeEl =
        document.createElement("div");

      typeEl.className = "media-title";
      typeEl.textContent = "📁 " + documentType;

      card.appendChild(typeEl);
    }

    const date = getDate(record);

    if(date){

      const d =
        document.createElement("div");

      d.className = "date";
      d.textContent = date;

      card.appendChild(d);
    }

    const media =
      document.createElement("div");

    media.className = "media";

    for(const file of files){

      const img =
        document.createElement("img");

      img.src = file.url;
      img.alt = file.name;
      img.loading = "lazy";

      media.appendChild(img);

      const a =
        document.createElement("a");

      a.href = file.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "파일 보기";

      media.appendChild(a);
    }

    card.appendChild(media);
    addDeleteButton(record, card);
    list.appendChild(card);
  }
}


/* =====================================================
   동영상 표시
===================================================== */

function renderVideos(){

  const videoRecords =
    getVideoRecords();

  list.innerHTML = "";

  if(!videoRecords.length){

    list.innerHTML =
      `<div class="empty">
        동영상 자료가 없습니다.
      </div>`;

    return;
  }

  for(const item of videoRecords){

    const record = item.record;
    const files = item.files;

    const card =
      document.createElement("section");

    card.className = "card";

    const title =
      document.createElement("div");

    title.className = "card-title";
    title.textContent = getTitle(record);

    card.appendChild(title);

    const documentType =
      getDocumentType(record);

    if(documentType){

      const typeEl =
        document.createElement("div");

      typeEl.className = "media-title";
      typeEl.textContent = "📁 " + documentType;

      card.appendChild(typeEl);
    }

    const date = getDate(record);

    if(date){

      const d =
        document.createElement("div");

      d.className = "date";
      d.textContent = date;

      card.appendChild(d);
    }

    const media =
      document.createElement("div");

    media.className = "media";

    for(const file of files){

      const video =
        document.createElement("video");

      video.src = file.url;
      video.controls = true;
      video.playsInline = true;

      media.appendChild(video);

      const a =
        document.createElement("a");

      a.href = file.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "파일 보기";

      media.appendChild(a);
    }

    card.appendChild(media);
    addDeleteButton(record, card);
    list.appendChild(card);
  }
}


/* =====================================================
   화면 표시
===================================================== */

function render(type){

  setPageTitle(type);

  if(type === "이미지"){
    renderImages();
    return;
  }

  if(type === "동영상"){
    renderVideos();
    return;
  }

  renderDocuments(
    getDocumentRecords(type),
    type
  );
}


/* =====================================================
   Airtable 자료 불러오기
===================================================== */

async function load(type){

  document
    .querySelectorAll(".bottom button")
    .forEach(
      button => {
        button.classList.toggle(
          "active",
          button.dataset.type === type
        );
      }
    );

  setPageTitle(type);

  list.innerHTML =
    `<div class="status">
      ${type} 자료를 불러오는 중입니다...
    </div>`;

  try{

    const requestUrl =
      API_URL +
      "?maxRecords=100" +
      "&view=" +
      encodeURIComponent(AIRTABLE_VIEW) +
      "&t=" +
      Date.now();

    const response =
      await fetch(requestUrl, {
        cache: "no-store"
      });

    if(!response.ok){
      throw new Error(
        "Worker 응답 오류: HTTP " +
        response.status
      );
    }

    const data =
      await response.json();

    if(!data.success){
      throw new Error("Worker 조회 실패");
    }

    allRecords =
      Array.isArray(data.records)
        ? sortNewestFirst(data.records)
        : [];

    render(type);

  }catch(error){

    console.error(error);

    list.innerHTML =
      `<div class="error">
        <strong>
          ❌ 자료를 가져오지 못했습니다.
        </strong>
        <br><br>
        ${error.message}
      </div>`;
  }
}


/* =====================================================
   하단 버튼
===================================================== */

document
  .querySelectorAll(".bottom button")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          const type =
            button.dataset.type;

          const newUrl =
            window.location.pathname +
            "?type=" +
            encodeURIComponent(type);

          window.history.pushState(
            {},
            "",
            newUrl
          );

          load(type);
        }
      );
    }
  );


/* =====================================================
   브라우저 뒤로가기
===================================================== */

window.addEventListener(
  "popstate",
  () => {
    load(getTypeFromURL());
  }
);


/* =====================================================
   처음 실행
===================================================== */

const initialType =
  getTypeFromURL();

load(initialType);

</script>

</body>
</html>
