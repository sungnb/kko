<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#242424">

<title>카톡 기록</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f6f5;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI","Noto Sans KR",sans-serif;
}

header{
  background:#242424;
  color:#fff;
  padding:18px 16px;
  text-align:center;
  font-size:22px;
  font-weight:700;
  position:sticky;
  top:0;
  z-index:5;
}

main{
  padding:14px 12px 92px;
  max-width:720px;
  margin:auto;
}

.status{
  text-align:center;
  color:#777;
  font-size:14px;
  padding:12px;
}


/* =====================================================
   기본 카드
===================================================== */

.card{
  background:#fff;
  border-radius:14px;
  padding:16px;
  margin:10px 0;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  border:1px solid rgba(0,0,0,.08);
}


/* =====================================================
   📄 일반문서 카드
===================================================== */

.card.document-normal{
  background:#f7f7f7;
  border-color:#d7d7d7;
}


/* =====================================================
   ⭐ 중요문서 카드
===================================================== */

.card.document-important{
  background:#fffbea;
  border-color:#eadb9a;
}


/* =====================================================
   🖼️ 이미지 카드
===================================================== */

.card.document-image{
  background:#f1f9f3;
  border-color:#b9d8be;
}


/* =====================================================
   🎬 동영상 카드
===================================================== */

.card.document-video{
  background:#f1f7fc;
  border-color:#b8d0e5;
}


/* =====================================================
   제목
===================================================== */

.card-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:8px;
}

.date{
  font-size:13px;
  color:#888;
  margin-bottom:10px;
}

.notes{
  font-size:16px;
  line-height:1.65;
  white-space:pre-wrap;
  word-break:break-word;
}


/* =====================================================
   미디어
===================================================== */

.media{
  margin-top:12px;
}

.media img,
.media video{
  display:block;
  width:100%;
  max-height:520px;
  object-fit:contain;
  border-radius:10px;
  background:#eee;
  margin-bottom:8px;
}


/* =====================================================
   📎 파일 보기 버튼
===================================================== */

.media a{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-width:110px;
  height:40px;

  padding:0 16px;

  margin-top:4px;
  margin-bottom:10px;

  border:1px solid #b8cdbb;
  border-radius:9px;

  background:#f2f8f3;
  color:#285c31;

  text-decoration:none;

  font-size:14px;
  font-weight:700;

  box-shadow:0 1px 3px rgba(0,0,0,.08);

  transition:all .15s ease;
}

.media a:hover{
  background:#e1efe3;
}

.media a:active{
  transform:scale(.97);
  background:#d5e8d8;
}


/* =====================================================
   📋 복사 / 🗑️ 삭제 버튼
===================================================== */

.action-buttons{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.copy-button,
.delete-button{
  flex:1;
  height:46px;
  border-radius:10px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:all .15s ease;
}


/* =====================================================
   📋 복사 버튼
===================================================== */

.copy-button{
  border:1px solid #9fbea4;
  background:#edf6ef;
  color:#285c31;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
}

.copy-button:hover{
  background:#e1efe3;
}

.copy-button:active{
  transform:scale(.97);
  background:#d5e8d8;
}


/* =====================================================
   🗑️ 삭제 버튼
===================================================== */

.delete-button{
  border:1px solid #d9a0a0;
  background:#fff3f3;
  color:#b00000;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
}

.delete-button:hover{
  background:#ffe8e8;
}

.delete-button:active{
  transform:scale(.97);
  background:#ffdada;
}


/* =====================================================
   버튼 비활성화
===================================================== */

.copy-button:disabled,
.delete-button:disabled{
  opacity:.6;
  cursor:default;
  transform:none;
}
/* =====================================================
   📚 개인연구 입력 / 수정
===================================================== */
.research-form{
  background:#2b2b2b;
  border:1px solid #444;
  border-radius:14px;
  padding:15px;
  margin:10px 0 16px;
}

.research-form-title{
  color:#c5a8ee;
  font-size:17px;
  font-weight:800;
  margin-bottom:10px;
}

.research-form input,
.research-form textarea{
  width:100%;
  border:1px solid #555;
  border-radius:9px;
  background:#171717;
  color:#fff;
  padding:11px 12px;
  font-size:16px;
  outline:none;
  margin-bottom:9px;
}

.research-form textarea{
  min-height:130px;
  resize:vertical;
  line-height:1.55;
}

.research-form input:focus,
.research-form textarea:focus{
  border-color:#c5a8ee;
}

.research-form-actions{
  display:flex;
  gap:9px;
}

.research-form-actions button{
  flex:1;
  height:44px;
  border-radius:9px;
  border:1px solid #75658d;
  background:#342b40;
  color:#dfd0f2;
  font-size:14px;
  font-weight:700;
}

.research-cancel-button{
  border-color:#555 !important;
  background:#292929 !important;
  color:#ddd !important;
}

.research-action-row{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.research-edit-button{
  flex:1;
  height:46px;
  border-radius:10px;
  border:1px solid #75658d;
  background:#342b40;
  color:#dfd0f2;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.research-edit-button:active{
  transform:scale(.97);
}



/* =====================================================
   기타
===================================================== */

.media-title{
  font-size:14px;
  color:#777;
  margin-bottom:8px;
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:#242424;
  border-top:1px solid #3b3b3b;
  padding:7px 5px 6px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:3px;
  z-index:10;
}

.bottom button{
  border:0;
  border-radius:8px;
  background:transparent;
  color:#eee;
  font-size:13px;
  font-weight:700;
  padding:7px 2px 6px;
  min-height:62px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
}

.bottom button .bottom-icon{
  font-size:25px;
  line-height:1;
}

.bottom button.active{
  background:transparent;
  color:#c5a8ee;
}

@media(max-width:480px){
  .bottom{
    padding:6px 3px 5px;
  }

  .bottom button{
    min-height:62px;
    font-size:11px;
    padding-left:1px;
    padding-right:1px;
  }

  .bottom button .bottom-icon{
    font-size:23px;
  }
}

.empty{
  text-align:center;
  padding:45px 10px;
  color:#777;
}

.error{
  background:#fff0f0;
  border:1px solid #e0a0a0;
  color:#a00000;
  border-radius:12px;
  padding:15px;
  margin:12px 0;
  line-height:1.6;
}

</style>
</head>


<body>

<header id="pageTitle">카톡 기록</header>

<main id="list">

  <div class="status">
    자료를 불러오는 중입니다...
  </div>

</main>


<nav class="bottom">

  <button data-type="일반문서">
    <span class="bottom-icon">📄</span>
    <span>일반문서</span>
  </button>

  <button data-type="중요문서">
    <span class="bottom-icon">⭐</span>
    <span>중요문서</span>
  </button>

  <button data-type="이미지">
    <span class="bottom-icon">🖼️</span>
    <span>이미지</span>
  </button>

  <button data-type="동영상">
    <span class="bottom-icon">🎬</span>
    <span>동영상</span>
  </button>

  <button data-type="개인연구">
    <span class="bottom-icon">📚</span>
    <span>개인연구</span>
  </button>

</nav>


<script>

/* =====================================================
   Cloudflare Worker
===================================================== */

const API_URL =
  "https://kakao.s01021319376.workers.dev/";


const AIRTABLE_VIEW =
  "viwreVjNBkgyyOG7C";


const list =
  document.getElementById("list");


const pageTitle =
  document.getElementById("pageTitle");


let allRecords = [];


/* =====================================================
   URL의 ?type= 값 읽기
===================================================== */

function getTypeFromURL(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const type =
    params.get("type");

  const allowedTypes = [
    "일반문서",
    "중요문서",
    "이미지",
    "동영상",
    "개인연구"
  ];

  if(
    allowedTypes.includes(type)
  ){

    return type;

  }

  return "일반문서";
}


/* =====================================================
   페이지 제목
===================================================== */

function setPageTitle(type){

  const titles = {

    "일반문서":
      "📄 일반문서",

    "중요문서":
      "⭐ 중요문서",

    "이미지":
      "🖼️ 이미지",

    "동영상":
      "🎬 동영상"

  };

  pageTitle.textContent =
    titles[type] || "카톡 기록";

}


/* =====================================================
   필드 찾기
===================================================== */

function field(fields,names){

  for(
    const name of names
  ){

    if(
      fields[name] !== undefined &&
      fields[name] !== null &&
      fields[name] !== ""
    ){

      return fields[name];

    }

  }

  return "";
}


/* =====================================================
   문서 종류
===================================================== */

function getDocumentType(record){

  const f =
    record.fields || {};

  return String(
    field(
      f,
      [
        "Name",
        "문서구분",
        "DocumentType",
        "자료구분",
        "구분",
        "Type",
        "종류"
      ]
    )
  ).trim();

}


/* =====================================================
   첨부파일
===================================================== */

function attachmentList(fields){

  const files = [];

  for(
    const [key,value]
    of Object.entries(fields || {})
  ){

    if(
      !Array.isArray(value)
    ){

      continue;

    }

    for(
      const item of value
    ){

      if(
        item &&
        typeof item === "object" &&
        item.url
      ){

        files.push({

          key:key,

          url:item.url,

          type:String(
            item.type || ""
          ).toLowerCase(),

          name:
            item.filename ||
            key

        });

      }

    }

  }

  return files;
}


/* =====================================================
   이미지 파일
===================================================== */

function isImageFile(file){

  if(
    file.type &&
    file.type.startsWith("image/")
  ){

    return true;

  }

  return /\.(jpg|jpeg|png|gif|webp|heic|heif)$/i
    .test(file.name);
}


/* =====================================================
   동영상 파일
===================================================== */

function isVideoFile(file){

  if(
    file.type &&
    file.type.startsWith("video/")
  ){

    return true;

  }

  return /\.(mp4|mov|m4v|webm|avi|mkv)$/i
    .test(file.name);
}


/* =====================================================
   날짜
===================================================== */

function getDate(record){

  const f =
    record.fields || {};

  return field(
    f,
    [
      "Date",
      "날짜",
      "작성일"
    ]
  );
}


/* =====================================================
   제목
===================================================== */

function getTitle(record){

  const f =
    record.fields || {};

  return field(
    f,
    [
      "Title",
      "제목",
      "Name"
    ]
  ) || "카톡 기록";
}


/* =====================================================
   내용
===================================================== */

function getNotes(record){

  const f =
    record.fields || {};

  return field(
    f,
    [
      "Notes",
      "내용",
      "Text",
      "text"
    ]
  );
}


/* =====================================================
   최신순 정렬
===================================================== */

function getRecordSortTime(record){

  if(
    record.createdTime
  ){

    const created =
      Date.parse(
        record.createdTime
      );

    if(
      !Number.isNaN(created)
    ){

      return created;

    }

  }

  const dateValue =
    getDate(record);

  const parsed =
    Date.parse(
      String(dateValue)
    );

  return Number.isNaN(parsed)
    ? 0
    : parsed;
}


function sortNewestFirst(records){

  return [...records].sort(
    (a,b) =>
      getRecordSortTime(b) -
      getRecordSortTime(a)
  );

}


/* =====================================================
   일반문서 / 중요문서
===================================================== */

function getDocumentRecords(type){

  return sortNewestFirst(
    allRecords.filter(
      record =>
        getDocumentType(record) === type
    )
  );

}


/* =====================================================
   이미지 자료
===================================================== */

function getImageRecords(){

  const result = [];

  for(
    const record of allRecords
  ){

    const files =
      attachmentList(
        record.fields || {}
      ).filter(
        file =>
          isImageFile(file)
      );

    if(files.length){

      result.push({

        record:record,

        files:files

      });

    }

  }

  return result.sort(
    (a,b) =>
      getRecordSortTime(
        b.record
      ) -
      getRecordSortTime(
        a.record
      )
  );

}


/* =====================================================
   동영상 자료
===================================================== */

function getVideoRecords(){

  const result = [];

  for(
    const record of allRecords
  ){

    const files =
      attachmentList(
        record.fields || {}
      ).filter(
        file =>
          isVideoFile(file)
      );

    if(files.length){

      result.push({

        record:record,

        files:files

      });

    }

  }

  return result.sort(
    (a,b) =>
      getRecordSortTime(
        b.record
      ) -
      getRecordSortTime(
        a.record
      )
  );

}


/* =====================================================
   카드 색상
===================================================== */

function getCardClass(type){

  switch(type){

    case "중요문서":

      return "card document-important";

    case "이미지":

      return "card document-image";

    case "동영상":

      return "card document-video";

    case "일반문서":

      return "card document-normal";

    default:

      return "card";

  }

}


/* =====================================================
   📋 복사
===================================================== */

async function copyNotes(record){

  const notes =
    getNotes(record);

  if(!notes){

    alert(
      "복사할 내용이 없습니다."
    );

    return;
  }

  try{

    await navigator.clipboard.writeText(
      String(notes)
    );

    alert(
      "📋 복사되었습니다."
    );

  }catch(error){

    const textarea =
      document.createElement(
        "textarea"
      );

    textarea.value =
      String(notes);

    textarea.style.position =
      "fixed";

    textarea.style.left =
      "-9999px";

    document.body.appendChild(
      textarea
    );

    textarea.focus();

    textarea.select();

    document.execCommand(
      "copy"
    );

    textarea.remove();

    alert(
      "📋 복사되었습니다."
    );
  }

}


/* =====================================================
   🗑️ 삭제
===================================================== */

async function deleteRecord(
  record,
  card
){

  const recordId =
    record.id;

  if(!recordId){

    alert(
      "삭제할 자료의 ID를 찾지 못했습니다."
    );

    return;
  }


  const confirmed =
    confirm(
      "이 자료를 삭제하시겠습니까?\n\n" +
      "삭제하면 Airtable에서도 삭제됩니다."
    );


  if(!confirmed){

    return;
  }


  const deleteButton =
    card.querySelector(
      ".delete-button"
    );


  if(deleteButton){

    deleteButton.disabled =
      true;

    deleteButton.textContent =
      "삭제 중...";

  }


  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"DELETE",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            recordId:
              recordId
          })

        }
      );


    const result =
      await response.json();


    if(
      !response.ok ||
      !result.success
    ){

      throw new Error(
        result.error?.message ||
        result.error ||
        "삭제에 실패했습니다."
      );

    }


    await load(
      getTypeFromURL()
    );


  }catch(error){

    console.error(error);

    alert(
      "삭제하지 못했습니다.\n\n" +
      error.message
    );


    if(deleteButton){

      deleteButton.disabled =
        false;

      deleteButton.textContent =
        "🗑️ 삭제";

    }

  }

}


/* =====================================================
   📋 복사 / 🗑️ 삭제 버튼
===================================================== */

function addActionButtons(
  record,
  card
){

  const actionButtons =
    document.createElement(
      "div"
    );

  actionButtons.className =
    "action-buttons";


  const copyButton =
    document.createElement(
      "button"
    );

  copyButton.type =
    "button";

  copyButton.className =
    "copy-button";

  copyButton.textContent =
    "📋 복사";


  copyButton.addEventListener(
    "click",
    function(){

      copyNotes(record);

    }
  );


  const deleteButton =
    document.createElement(
      "button"
    );

  deleteButton.type =
    "button";

  deleteButton.className =
    "delete-button";

  deleteButton.textContent =
    "🗑️ 삭제";


  deleteButton.addEventListener(
    "click",
    function(){

      deleteRecord(
        record,
        card
      );

    }
  );


  actionButtons.appendChild(
    copyButton
  );

  actionButtons.appendChild(
    deleteButton
  );


  card.appendChild(
    actionButtons
  );

}


/* =====================================================
   일반문서 / 중요문서 표시
===================================================== */

function renderDocuments(
  records,
  type
){

  list.innerHTML = "";


  if(!records.length){

    list.innerHTML =
      `<div class="empty">
        ${type} 자료가 없습니다.
      </div>`;

    return;
  }


  for(
    const record of records
  ){

    const card =
      document.createElement(
        "section"
      );

    /* ★ 자료 종류에 따른 색상 적용 */

    card.className =
      getCardClass(type);


    const titleEl =
      document.createElement(
        "div"
      );

    titleEl.className =
      "card-title";

    titleEl.textContent =
      getTitle(record);

    card.appendChild(
      titleEl
    );


    const date =
      getDate(record);

    if(date){

      const d =
        document.createElement(
          "div"
        );

      d.className =
        "date";

      d.textContent =
        date;

      card.appendChild(
        d
      );

    }


    const notes =
      getNotes(record);

    if(notes){

      const n =
        document.createElement(
          "div"
        );

      n.className =
        "notes";

      n.textContent =
        notes;

      card.appendChild(
        n
      );

    }


    const files =
      attachmentList(
        record.fields || {}
      );


    if(files.length){

      const media =
        document.createElement(
          "div"
        );

      media.className =
        "media";


      for(
        const file of files
      ){

        if(
          isVideoFile(file)
        ){

          const video =
            document.createElement(
              "video"
            );

          video.src =
            file.url;

          video.controls =
            true;

          video.playsInline =
            true;

          media.appendChild(
            video
          );

        }
        else if(
          isImageFile(file)
        ){

          const img =
            document.createElement(
              "img"
            );

          img.src =
            file.url;

          img.alt =
            file.name;

          img.loading =
            "lazy";

          media.appendChild(
            img
          );

        }


        const a =
          document.createElement(
            "a"
          );

        a.href =
          file.url;

        a.target =
          "_blank";

        a.rel =
          "noopener";

        a.textContent =
          "📎 파일 보기";

        media.appendChild(
          a
        );

      }


      card.appendChild(
        media
      );

    }


    addActionButtons(
      record,
      card
    );


    list.appendChild(
      card
    );

  }

}


/* =====================================================
   이미지 표시
===================================================== */

function renderImages(){

  const imageRecords =
    getImageRecords();


  list.innerHTML = "";


  if(!imageRecords.length){

    list.innerHTML =
      `<div class="empty">
        이미지 자료가 없습니다.
      </div>`;

    return;
  }


  for(
    const item of imageRecords
  ){

    const record =
      item.record;

    const files =

function createPersonalResearchForm(editRecord = null){
  const isEdit = !!editRecord;

  const form = document.createElement("div");
  form.className = "research-form";

  form.innerHTML = `
    <div class="research-form-title">
      ${isEdit ? "✏️ 개인연구 수정" : "➕ 개인연구 기록"}
    </div>

    <input
      class="research-name"
      type="text"
      maxlength="200"
      placeholder="제목"
      value="${escapeHtmlAttribute(isEdit ? getTitle(editRecord) : "")}"
    >

    <textarea
      class="research-notes"
      placeholder="연구 내용을 입력하세요."
    >${escapeHtml(isEdit ? getNotes(editRecord) : "")}</textarea>

    <div class="research-form-actions">
      <button type="button" class="research-save-button">
        ${isEdit ? "수정 저장" : "기록 저장"}
      </button>
      <button type="button" class="research-cancel-button">
        ${isEdit ? "취소" : "닫기"}
      </button>
    </div>
  `;

  form.querySelector(".research-cancel-button")
    .addEventListener("click", () => form.remove());

  form.querySelector(".research-save-button")
    .addEventListener("click", async () => {

      const name =
        form.querySelector(".research-name").value.trim();

      const notes =
        form.querySelector(".research-notes").value.trim();

      if(!name && !notes){
        alert("제목 또는 내용을 입력해 주세요.");
        return;
      }

      const saveButton =
        form.querySelector(".research-save-button");

      saveButton.disabled = true;
      saveButton.textContent =
        isEdit ? "수정 중..." : "기록 중...";

      try{

        const response = await fetch(API_URL,{
          method:isEdit ? "PATCH" : "POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify(
            isEdit
              ? {
                  table:"개인연구",
                  recordId:editRecord.id,
                  fields:{
                    Name:name,
                    Notes:notes
                  }
                }
              : {
                  table:"개인연구",
                  name:name,
                  notes:notes
                }
          )
        });

        const result = await response.json();

        if(!response.ok || !result.success){
          throw new Error(
            result.error?.message ||
            result.error ||
            result.message ||
            "저장하지 못했습니다."
          );
        }

        await load("개인연구");

      }catch(error){

        console.error(error);

        alert(
          "개인연구를 저장하지 못했습니다.\n\n" +
          error.message
        );

        saveButton.disabled = false;
        saveButton.textContent =
          isEdit ? "수정 저장" : "기록 저장";
      }
    });

  return form;
}


function render(type){

  setPageTitle(type);

  if(type === "개인연구"){
    renderPersonalResearch(sortNewestFirst(allRecords));
    return;
  }


  if(
    type === "이미지"
  ){

    renderImages();

    return;
  }


  if(
    type === "동영상"
  ){

    renderVideos();

    return;
  }

  renderDocuments(
    getDocumentRecords(type),
    type
  );

}

    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");

function showPersonalResearchForm(record=null){
  const editing=!!record, f=editing?(record.fields||{}):{};
  const overlay=document.createElement("div");
  overlay.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:flex;align-items:flex-end;justify-content:center;";
  overlay.innerHTML=`<div style="width:min(100%,720px);background:#242424;color:#fff;border-radius:18px 18px 0 0;padding:20px;">
    <div style="font-size:21px;font-weight:800;margin-bottom:15px;">${editing?"개인연구 수정":"새 개인연구 기록"}</div>
    <input id="prName" value="${escapeHtml(f.Name||"")}" placeholder="제목" style="width:100%;height:48px;border:1px solid #555;border-radius:9px;background:#111;color:#fff;padding:0 13px;font-size:16px;margin-bottom:10px;">
    <textarea id="prNotes" placeholder="연구 내용을 입력하세요" style="width:100%;min-height:190px;border:1px solid #555;border-radius:9px;background:#111;color:#fff;padding:13px;font-size:16px;line-height:1.6;resize:vertical;">${escapeHtml(f.Notes||"")}</textarea>
    <div style="display:flex;gap:9px;margin-top:12px;">
      <button id="prCancel" type="button" style="flex:1;height:46px;border:1px solid #555;border-radius:9px;background:#292929;color:#eee;font-weight:700;">취소</button>
      <button id="prSave" type="button" style="flex:1;height:46px;border:0;border-radius:9px;background:#8d72b8;color:#fff;font-weight:800;">${editing?"수정 저장":"기록 저장"}</button>
    </div></div>`;
  document.body.appendChild(overlay);
  overlay.querySelector("#prCancel").onclick=()=>overlay.remove();
  overlay.querySelector("#prSave").onclick=async()=>{
    const name=overlay.querySelector("#prName").value.trim();
    const notes=overlay.querySelector("#prNotes").value.trim();
    if(!name&&!notes){alert("제목이나 연구 내용을 입력해 주세요.");return;}
    const save=overlay.querySelector("#prSave"); save.disabled=true; save.textContent=editing?"수정 중...":"기록 중...";
    try{
      const r=await fetch(API_URL,{method:editing?"PATCH":"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({table:"개인연구",recordId:editing?record.id:undefined,fields:{Name:name,Notes:notes}})});
      const d=await r.json(); if(!r.ok||!d.success) throw new Error(d.error?.message||d.error||"저장에 실패했습니다.");
      overlay.remove(); await load("개인연구");
    }catch(e){alert("개인연구 저장에 실패했습니다.\n\n"+e.message);save.disabled=false;save.textContent=editing?"수정 저장":"기록 저장";}
  };
}

async function deletePersonalResearch(record){
  if(!confirm("이 개인연구 기록을 삭제하시겠습니까?"))return;
  try{
    const r=await fetch(API_URL,{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({table:"개인연구",recordId:record.id})});
    const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error?.message||d.error||"삭제에 실패했습니다.");
    await load("개인연구");
  }catch(e){alert("개인연구 삭제에 실패했습니다.\n\n"+e.message);}
}

function renderPersonalResearch(records){
  list.innerHTML="";
  const add=document.createElement("button");
  add.type="button"; add.textContent="＋";
  add.style.cssText="width:100%;height:52px;margin:0 0 14px;border:0;border-radius:10px;background:#8d72b8;color:#fff;font-size:16px;font-weight:800;";
  add.onclick=()=>showPersonalResearchForm(); list.appendChild(add);

  const personalRecords = sortNewestFirst(
    (records || []).filter(r => {
      const f = r.fields || {};
      return f.Name !== undefined || f.Notes !== undefined;
    })
  );
  if(!personalRecords.length){list.insertAdjacentHTML("beforeend",'<div class="empty">개인연구 기록이 없습니다.</div>');return;}

  personalRecords.forEach(record=>{
    const f=record.fields||{}, card=document.createElement("section");
    card.className=getCardClass("개인연구");
    const title=document.createElement("div"); title.className="card-title"; title.textContent=f.Name||"개인연구"; card.appendChild(title);
    const date=getDate(record); if(date){const d=document.createElement("div");d.className="date";d.textContent=date;card.appendChild(d);}
    if(f.Notes){const n=document.createElement("div");n.className="notes";n.textContent=f.Notes;card.appendChild(n);}
    const actions=document.createElement("div");actions.className="action-buttons";
    const edit=document.createElement("button");edit.className="copy-button";edit.textContent="✏️ 수정";edit.onclick=()=>showPersonalResearchForm(record);
    const del=document.createElement("button");del.className="delete-button";del.textContent="🗑️ 삭제";del.onclick=()=>deletePersonalResearch(record);
    actions.append(edit,del);card.appendChild(actions);list.appendChild(card);
  });
}

async function load(type){

  document
    .querySelectorAll(
      ".bottom button"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.type === type
        );

      }
    );


  setPageTitle(type);


  list.innerHTML =
    `<div class="status">
      ${type} 자료를 불러오는 중입니다...
    </div>`;


  try{

    const requestUrl =
      type === "개인연구"
        ? API_URL +
          "?maxRecords=100" +
          "&table=" +
          encodeURIComponent("개인연구") +
          "&t=" +
          Date.now()
        : API_URL +
          "?maxRecords=100" +
          "&view=" +
          encodeURIComponent(AIRTABLE_VIEW) +
          "&t=" +
          Date.now();


    const response =
      await fetch(
        requestUrl,
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "Worker 응답 오류: HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if(!data.success){

      throw new Error(
        "Worker 조회 실패"
      );

    }


    allRecords =
      Array.isArray(data.records)
        ? sortNewestFirst(
            data.records
          )
        : [];


    render(type);


  }catch(error){

    console.error(error);


    list.innerHTML =
      `<div class="error">

        <strong>
          ❌ 자료를 가져오지 못했습니다.
        </strong>

        <br><br>

        ${error.message}

      </div>`;

  }

}

   하단 버튼

document
  .querySelectorAll(
    ".bottom button"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          const type =
            button.dataset.type;


          const newUrl =
            window.location.pathname +
            "?type=" +
            encodeURIComponent(
              type
            );


          window.history.pushState(
            {},
            "",
            newUrl
          );


          load(type);

        }
      );

    }
  );
