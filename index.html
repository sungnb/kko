/*
   Airtable에서 받은 자료를
   Date 기준 최신순으로 정렬합니다.
*/

allRecords =
  Array.isArray(data.records)
    ? data.records
    : [];

allRecords.sort((a, b) => {
  const dateA =
    new Date(
      a.fields?.Date || 0
    ).getTime();

  const dateB =
    new Date(
      b.fields?.Date || 0
    ).getTime();

  return dateB - dateA;
});
